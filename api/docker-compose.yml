version: "3.8"

networks:
  # Shared network so the API can reach Neo4j by service name
  app-net:
    driver: bridge

services:
  # ── Neo4j Knowledge Graph Database ──────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-learner
    ports:
      - "7474:7474"   # Web browser UI  →  http://localhost:7474
      - "7687:7687"   # Bolt (driver)
    environment:
      - NEO4J_AUTH=neo4j/password   # Change in production via .env
    volumes:
      - neo4j_data:/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Whisper Diarization + Knowledge Graph API ────────────────────────────────
  whisper-api:
    build:
      # Build context is the project root so Dockerfile can COPY core/ and model_cache/
      context: ..
      dockerfile: api/Dockerfile

    image: whisper-api:local

    ports:
      - "8000:8000"

    depends_on:
      neo4j:
        condition: service_healthy   # Wait until Neo4j is ready before starting

    # GPU access — requires nvidia-container-toolkit on the host.
    # Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - CUDA_VISIBLE_DEVICES=0     # which GPU to use (0 = first GPU)
      - DEVICE=cuda
      - COMPUTE_TYPE=int8
      # Override localhost → Docker service name so the API can reach Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

    env_file:
      - ../.env   # Reads OPENAI_API_KEY and other secrets

    networks:
      - app-net

    restart: unless-stopped

    # Optional: mount model_cache as a volume instead of baking into the image.
    # volumes:
    #   - ../model_cache:/app/model_cache:ro

volumes:
  neo4j_data:
